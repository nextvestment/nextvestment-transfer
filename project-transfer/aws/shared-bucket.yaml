AWSTemplateFormatVersion: '2010-09-09'
Description: Private versioned project exchange. No public access or long-lived credentials.
Parameters:
  BucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  FolderPrefix:
    Type: String
    Default: project-share/
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9._/-]*/'
Resources:
  ProjectBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteTransfers
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: ProjectShare
        - Key: Purpose
          Value: Project file exchange
  TransportPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProjectBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ProjectBucket.Arn
              - !Sub '${ProjectBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  Bucket:
    Value: !Ref ProjectBucket
  Region:
    Value: !Ref AWS::Region
  ProjectPrefix:
    Value: !Ref FolderPrefix
